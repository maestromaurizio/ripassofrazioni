<!DOCTYPE html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Ripasso di Matematica</title>

<style>
/* Ripasso di Matematica – classe 5ª. Un solo giocatore; funziona su LIM, tablet e telefono */
:root{
  --paper:#f6f8f4; --card:#ffffff; --ink:#1b2a3a; --muted:#5a6b78;
  --sea:#2f6fa8; --sea-soft:#dbe8f5; --land:#5b8c3a; --land-soft:#e2efd6;
  --sand:#e9b949; --sand-soft:#fbf0d2; --wrong:#c2473a; --wrong-soft:#f8e0dc;
  --line:#c9d3cc; --violet:#7a58b0; --violet-soft:#ece4f7; --teal:#23827d; --teal-soft:#d5efec;
  --f-display:"Fredoka", "Trebuchet MS", system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", "Verdana", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#13202b; --card:#1b2b38; --ink:#eef3f6; --muted:#a9b9c4;
  --sea:#7fb3e6; --sea-soft:#22405c; --land:#9cc97a; --land-soft:#27402a;
  --sand:#f0c862; --sand-soft:#47391a; --wrong:#f08a7e; --wrong-soft:#4a2421; --line:#33495a; --violet:#b79ae6; --violet-soft:#33284a; --teal:#6fd0c8; --teal-soft:#1d3c3a; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#13202b; --card:#1b2b38; --ink:#eef3f6; --muted:#a9b9c4;
  --sea:#7fb3e6; --sea-soft:#22405c; --land:#9cc97a; --land-soft:#27402a;
  --sand:#f0c862; --sand-soft:#47391a; --wrong:#f08a7e; --wrong-soft:#4a2421; --line:#33495a; --violet:#b79ae6; --violet-soft:#33284a; --teal:#6fd0c8; --teal-soft:#1d3c3a; color-scheme:dark}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:clamp(17px,1.6vw,22px);
  background-image:radial-gradient(circle at 1px 1px, var(--line) 1px, transparent 1.4px);background-size:26px 26px}
.app{min-height:100%;box-sizing:border-box;display:flex;flex-direction:column;gap:clamp(12px,2vh,24px);
  max-width:1200px;margin:0 auto;padding-block:clamp(12px,2.5vh,28px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:4px solid var(--sand);outline-offset:3px}
[hidden]{display:none!important}

/* barra */
.bar{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-weight:700;font-size:1.15em;display:flex;align-items:center;gap:10px}
.brand svg{flex:none}
.sound{font-family:var(--f-display);font-weight:600;font-size:.85em;border:2px solid var(--ink);border-radius:999px;padding:6px 14px;background:var(--card);color:var(--ink)}
.sound[aria-pressed="false"]{color:var(--muted);border-style:dashed}
.turn{margin-left:auto;font-family:var(--f-display);font-weight:600;background:var(--card);border:2px solid var(--ink);border-radius:999px;padding:6px 18px;white-space:nowrap}
.turn b{color:var(--sea)}
.track{display:flex;gap:6px;flex-wrap:wrap;width:100%}
.dot{flex:1 1 14px;min-width:10px;height:12px;border-radius:6px;background:var(--line)}
.dot.ok{background:var(--land)} .dot.no{background:var(--wrong)} .dot.now{background:var(--sand);box-shadow:0 0 0 2px var(--ink)}

/* domanda */
.stage{flex:1;display:flex;flex-direction:column;gap:clamp(12px,2vh,22px)}
.qcard{background:var(--card);border:3px solid var(--ink);border-radius:22px;padding:clamp(18px,3vh,34px) clamp(18px,3vw,40px);
  box-shadow:6px 6px 0 var(--ink)}
.topic{display:inline-block;font-size:.72em;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.topic span{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px;vertical-align:middle}
.qtext{font-family:var(--f-display);font-weight:600;font-size:clamp(28px,3.6vw,52px);line-height:1.15}
.qcard{display:flex;gap:clamp(14px,2.5vw,32px);align-items:center;flex-wrap:wrap}
.qtxt{flex:1 1 380px;min-width:0}
.qimg{flex:0 1 auto;max-width:min(42%,460px);max-height:30vh;object-fit:contain;border-radius:12px;background:#fff;padding:6px;border:2px solid var(--line)}
.fimg{max-height:20vh;max-width:min(40%,320px);object-fit:contain;border-radius:10px;background:#fff;padding:4px;border:2px solid var(--line)}
@media (max-width:700px){.qimg{max-width:100%}}
.glos{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.glab{font-weight:700;color:var(--muted);font-size:.85em}
.gchip{font-family:var(--f-display);font-weight:600;font-size:.95em;border:2px dashed var(--sea);color:var(--sea);background:var(--card);border-radius:999px;padding:4px 16px}
.gchip.on{background:var(--sea);color:var(--card);border-style:solid}
.gdef{flex-basis:100%;background:var(--sea-soft);border-radius:14px;padding:10px 16px;font-size:1.05em}
.answers{display:grid;gap:clamp(10px,1.6vh,18px)}
.ans{display:flex;align-items:center;gap:18px;text-align:left;width:100%;background:var(--card);border:3px solid var(--ink);border-radius:18px;
  padding:clamp(8px,1.5vh,18px) clamp(14px,2vw,26px);font-size:clamp(22px,2.4vw,34px);line-height:1.2;transition:transform .12s}
.ans:hover:not(:disabled){transform:translateY(-2px);background:var(--sea-soft)}
.ans .k{flex:none;width:1.7em;height:1.7em;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;background:var(--ink);color:var(--card)}
.ans:disabled{cursor:default}
.ans.right{background:var(--land-soft);border-color:var(--land)} .ans.right .k{background:var(--land)}
.ans.bad{background:var(--wrong-soft);border-color:var(--wrong)} .ans.bad .k{background:var(--wrong)}
.ans.dim{opacity:.45}

.fb{display:flex;align-items:center;gap:18px;flex-wrap:wrap;border-radius:18px;padding:10px 22px;border:3px solid}
.fb.ok{background:var(--land-soft);border-color:var(--land)} .fb.no{background:var(--sand-soft);border-color:var(--sand)}
.fb .msg{flex:1 1 320px;min-width:0}
.fb .msg strong{font-family:var(--f-display);font-size:1.35em;display:block}
.btn{font-family:var(--f-display);font-weight:600;font-size:1.15em;border:3px solid var(--ink);border-radius:999px;padding:12px 28px;background:var(--sand);color:#1b2a3a;box-shadow:4px 4px 0 var(--ink)}
.btn:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--ink)}
.quit{display:grid;gap:8px;background:var(--sand-soft);border:3px solid var(--sand);border-radius:18px;padding:14px 18px}
.quit b{font-family:var(--f-display);font-size:1.2em}
.btn.qyes{background:var(--wrong);color:#fff}
.btn.rnd{background:var(--violet);color:#fff}
.btn.ghost{background:var(--card);color:var(--ink)}

/* inizio e fine */
.panel{background:var(--card);border:3px solid var(--ink);border-radius:24px;box-shadow:6px 6px 0 var(--ink);padding:clamp(20px,4vh,44px) clamp(18px,4vw,48px);display:grid;gap:22px}
.panel h1{font-size:clamp(34px,4.6vw,64px);line-height:1.05}
.panel p{margin:0;max-width:62ch}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.score{font-family:var(--f-display);font-weight:700;font-size:clamp(60px,9vw,130px);line-height:1;color:var(--land);font-variant-numeric:tabular-nums}
.recap{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.rc{border:2px solid var(--line);border-radius:14px;padding:10px 14px;font-size:.82em;display:flex;gap:10px;align-items:flex-start;min-width:0}
.rc b{flex:none;font-family:var(--f-display);width:1.8em;height:1.8em;border-radius:50%;display:grid;place-items:center;color:#fff}
.rc.ok b{background:var(--land)} .rc.no b{background:var(--wrong)}
.small{font-size:.8em;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
html{-webkit-text-size-adjust:100%}
button,label,input{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.hero{display:flex;gap:clamp(14px,3vw,36px);align-items:center;flex-wrap:wrap;background:linear-gradient(135deg,var(--sea-soft),var(--land-soft));border-radius:18px;padding:clamp(16px,3vw,30px);border:3px solid var(--ink)}
.hero .ht{flex:1 1 300px;min-width:0;display:grid;gap:12px}
.hero img{flex:0 1 auto;max-height:340px;max-width:min(260px,35%);object-fit:contain;border-radius:16px;background:#fff;border:2px solid var(--line);padding:6px}
.hero h1 .g{color:var(--sea)} .hero h1 .e{color:var(--land)}
.step{display:grid;gap:12px}
.step h3{font-size:1.15em;display:flex;align-items:center;gap:10px}
.step h3 i{font-style:normal;flex:none;width:1.6em;height:1.6em;border-radius:50%;display:grid;place-items:center;background:var(--ink);color:var(--card);font-size:.85em}
.step:nth-of-type(2) h3 i{background:var(--sea)} .step:nth-of-type(3) h3 i{background:var(--land)}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:10px}
.tbtn{display:flex;align-items:center;gap:12px;text-align:left;border:3px dashed var(--line);border-radius:16px;padding:12px 14px;background:var(--card);min-height:64px;color:var(--muted);transition:transform .12s}
.tbtn .ic{flex:none;font-size:1.6em;line-height:1;filter:grayscale(1);opacity:.5}
.tbtn .bx{flex:none;width:28px;height:28px;border-radius:8px;border:3px solid var(--line);display:grid;place-items:center;font-weight:700;background:var(--card);color:#fff}
.tbtn[aria-pressed="true"]{border:3px solid var(--c);background:var(--s);color:var(--ink);box-shadow:3px 3px 0 var(--c)}
.tbtn[aria-pressed="true"] .ic{filter:none;opacity:1}
.tbtn[aria-pressed="true"] .bx{background:var(--c);border-color:var(--c)}
.tbtn:active{transform:scale(.97)}
.tbtn .tn{flex:1;min-width:0;font-weight:700}
.tbtn .tc{font-size:.8em;color:var(--muted)}
.seg{display:flex;flex-wrap:wrap;gap:10px}
.seg button{font-family:var(--f-display);font-weight:600;font-size:1.05em;border:3px solid var(--ink);border-radius:999px;padding:10px 22px;background:var(--card);min-height:52px;transition:transform .12s}
.seg button:active{transform:scale(.95)}
.seg button:disabled{opacity:.35;cursor:default;border-style:dashed}
.seg button[aria-pressed="true"]{background:var(--sand);color:#1b2a3a;box-shadow:3px 3px 0 var(--ink)}
.link{background:none;border:none;padding:4px 2px;color:var(--sea);font-weight:700;text-decoration:underline;font-size:.9em}
.warn{color:var(--wrong);font-weight:700;font-size:.9em}
.counter{margin-left:auto;font-family:var(--f-display);font-weight:600;background:var(--card);border:2px solid var(--ink);border-radius:999px;padding:6px 18px;white-space:nowrap}
.counter b{color:var(--land)}
.vbtn{justify-self:start;display:inline-flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:600;font-size:1.05em;border:3px solid var(--ink);border-radius:999px;padding:10px 20px;background:var(--wrong);color:#fff;box-shadow:3px 3px 0 var(--ink);min-height:52px}
.vbtn span{display:grid;place-items:center;width:1.6em;height:1.6em;border-radius:50%;background:#fff;color:var(--wrong);font-size:.8em}
.vbtn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.vwrap{position:fixed;inset:0;background:rgba(10,20,30,.75);display:grid;place-items:center;padding:16px;z-index:50}
.vbox{background:var(--card);border:3px solid var(--ink);border-radius:20px;padding:14px;width:min(960px,100%);display:grid;gap:10px;box-sizing:border-box}
.vhead{display:flex;align-items:center;justify-content:space-between;gap:10px}
.vbox video{width:100%;aspect-ratio:16/9;max-height:70vh;border-radius:12px;background:#000}
.vbox a{color:var(--sea)}
.track.m{display:none}
.home{font-family:var(--f-display);font-weight:600;font-size:.85em;border:2px solid var(--ink);border-radius:999px;padding:6px 14px;background:var(--card)}
@media (max-width:700px){
  body{font-size:17px}
  .app{gap:12px}
  .bar{gap:8px;flex-wrap:nowrap}
  .bar .track{display:none}
  .brand{font-size:1em;min-width:0}
  .home,.sound,.counter{font-size:14px;padding:5px 10px}
  .counter{margin-left:auto}
  .track.m{display:flex}
  .qcard{flex-direction:column-reverse;align-items:stretch;padding:16px;box-shadow:4px 4px 0 var(--ink)}
  .qimg{max-width:100%;max-height:18vh;align-self:center}
  .qtxt{flex:none}
  .qtext{font-size:clamp(22px,6vw,30px)}
  .ans{font-size:clamp(18px,5vw,22px);gap:12px;padding:12px 14px;min-height:60px}
  .fb{padding:12px 14px;gap:12px}
  .fb .msg{flex-basis:100%}
  .fimg{max-width:45%}
  .fb .btn{width:100%}
  .panel{padding:18px 16px;box-shadow:4px 4px 0 var(--ink)}
  .hero{flex-wrap:nowrap;align-items:flex-start;gap:12px}
  .hero .ht{flex:1 1 auto;min-width:0}
  .hero h1{font-size:clamp(24px,7.4vw,32px)}
  .hero p{font-size:16px}
  .hero img{max-height:190px;max-width:32%;padding:3px}
  .btn{width:100%}
  .vbtn{width:100%;justify-content:center;font-size:16px}
  .dot{height:8px}
}
@media (max-height:520px) and (orientation:landscape){ .qimg{max-height:40vh} .hero img{display:none} }
</style></head><body>
<div class="app" id="app"></div>

<script>
const TOPICS={"t1": {"name": "Le frazioni (p. 38)", "c": "var(--sea)", "s": "var(--sea-soft)", "ic": "🍕"}, "t2": {"name": "Proprie, improprie, apparenti (p. 39)", "c": "var(--land)", "s": "var(--land-soft)", "ic": "📏"}, "t3": {"name": "Equivalenti e confronto (pp. 40-41)", "c": "var(--violet)", "s": "var(--violet-soft)", "ic": "⚖️"}, "t4": {"name": "Frazione di un numero (pp. 42-44)", "c": "var(--sand)", "s": "var(--sand-soft)", "ic": "🧮"}, "t5": {"name": "Frazioni e decimali (pp. 46-47)", "c": "var(--teal)", "s": "var(--teal-soft)", "ic": "🔢"}};
// a = risposte: la PRIMA è quella giusta (vengono mescolate a ogni domanda)
// img = chiave di IMG mostrata accanto alla domanda; after = immagine facoltativa mostrata solo dopo la risposta
// e = spiegazione breve mostrata dopo la risposta
const BANK=[{"t": "t1", "q": "Un intero è diviso in 5 parti uguali e ne coloriamo 2. Quale frazione è colorata?", "img": "b5_2", "a": ["2/5", "3/5", "5/2"], "e": "Il numeratore (2) dice quante parti prendiamo, il denominatore (5) in quante parti è diviso l’intero."}, {"t": "t1", "q": "Che cosa indica il denominatore di una frazione?", "img": "qm", "a": ["in quante parti uguali è diviso l’intero", "quante parti vengono considerate", "quante parti restano da colorare"], "e": "Il denominatore sta sotto la linea e dice in quante unità frazionarie è diviso l’intero."}, {"t": "t1", "q": "Che cosa indica la linea di frazione?", "img": "qm", "a": ["la divisione", "le parti prese", "le parti uguali"], "e": "La linea di frazione indica la divisione tra numeratore e denominatore."}, {"t": "t1", "q": "Ciascuna delle parti uguali in cui è diviso l’intero si chiama…", "img": "qm", "a": ["unità frazionaria", "frazione complementare", "numeratore"], "e": "Se l’intero è diviso in 5 parti, ogni parte è 1/5, cioè un’unità frazionaria."}, {"t": "t1", "q": "Quale frazione rappresenta la parte colorata?", "img": "p6_4", "a": ["4/6", "6/4", "2/6"], "e": "L’intero è diviso in 6 parti uguali e 4 sono colorate: 4/6."}, {"t": "t1", "q": "Qual è la frazione complementare di 2/5?", "img": "b5c", "a": ["3/5", "2/5", "5/2"], "e": "La frazione complementare completa l’intero: 2/5 + 3/5 = 5/5."}, {"t": "t1", "q": "Due frazioni complementari, sommate, danno…", "img": "qm", "a": ["l’intero, cioè 1", "zero", "il doppio del denominatore"], "e": "Per esempio 2/5 + 3/5 = 5/5 = 1."}, {"t": "t1", "q": "Quale coppia è formata da frazioni complementari?", "img": "p8c", "a": ["3/8 e 5/8", "3/8 e 3/5", "3/8 e 8/3"], "e": "3/8 + 5/8 = 8/8 = 1: le parti insieme completano l’intero."}, {"t": "t2", "q": "Una frazione propria rappresenta…", "img": "b5_3", "a": ["una parte minore dell’intero", "una parte maggiore dell’intero", "uno o più interi"], "e": "Nella frazione propria il numeratore è minore del denominatore, per esempio 3/5."}, {"t": "t2", "q": "Quale di queste frazioni è propria?", "img": "qm", "a": ["2/9", "9/2", "9/3"], "e": "2 è minore di 9: la parte è minore dell’intero."}, {"t": "t2", "q": "Quale frazione rappresentano le parti colorate?", "img": "b7_5", "a": ["7/5", "2/5", "7/2"], "e": "Ci sono 5 parti più 2 parti: 7/5. È maggiore dell’intero, quindi è una frazione impropria."}, {"t": "t2", "q": "Una frazione apparente rappresenta…", "img": "qm", "a": ["uno o più interi", "una parte minore dell’intero", "una parte maggiore di un intero, ma non intera"], "e": "Nella frazione apparente il numeratore è uguale o multiplo del denominatore, per esempio 10/5."}, {"t": "t2", "q": "Quale di queste frazioni è apparente?", "img": "qm", "a": ["10/5", "7/5", "5/10"], "e": "10 è multiplo di 5: 10 : 5 = 2, quindi la frazione vale 2 interi."}, {"t": "t2", "q": "Che cosa ci dice il calcolo 10 : 5 = 2 sulla frazione 10/5?", "img": "b10_5", "a": ["che rappresenta 2 interi", "che è una frazione propria", "che rappresenta mezzo intero"], "e": "10/5 sono 2 interi: la frazione è apparente."}, {"t": "t2", "q": "Sulla linea dei numeri, tra quali numeri si trova la frazione 3/5?", "img": "nl", "a": ["tra 0 e 1", "tra 1 e 2", "tra 2 e 3"], "e": "3/5 è una frazione propria: è minore di 1."}, {"t": "t2", "q": "Quale frazione si trova esattamente sul numero 2 della linea dei numeri?", "img": "nl", "a": ["10/5", "7/5", "3/5"], "e": "10/5 = 2: è una frazione apparente."}, {"t": "t3", "q": "Due frazioni sono equivalenti quando…", "img": "qm", "a": ["rappresentano la stessa parte di intero", "hanno lo stesso denominatore", "hanno lo stesso numeratore"], "e": "Le frazioni equivalenti hanno lo stesso valore e stanno nello stesso punto della linea dei numeri."}, {"t": "t3", "q": "Quale frazione è equivalente a 1/2?", "img": "b2_1", "a": ["3/6", "2/6", "1/3"], "e": "Moltiplicando sopra e sotto per 3 si ottiene 3/6."}, {"t": "t3", "q": "Come si passa da 2/3 a una frazione equivalente?", "img": "qm", "a": ["si moltiplica numeratore e denominatore per 3", "si somma 3 al numeratore e al denominatore", "si moltiplica solo il numeratore per 3"], "e": "Con la proprietà invariantiva si moltiplicano (o si dividono) sia il numeratore sia il denominatore per lo stesso numero: 2/3 = 6/9."}, {"t": "t3", "q": "Quale operazione trasforma 7/14 in 1/2?", "img": "qm", "a": ["dividere sopra e sotto per 7", "dividere sopra e sotto per 2", "moltiplicare sopra e sotto per 7"], "e": "7 : 7 = 1 e 14 : 7 = 2."}, {"t": "t3", "q": "Per capire se 4/5 e 8/10 sono equivalenti si moltiplica a incrocio. Quali prodotti si ottengono?", "img": "eq45", "a": ["4 × 10 = 40 e 5 × 8 = 40", "4 × 8 = 32 e 5 × 10 = 50", "4 × 5 = 20 e 8 × 10 = 80"], "e": "I prodotti sono uguali (40 e 40): le frazioni sono equivalenti."}, {"t": "t3", "q": "Tra 5/7 e 3/7, quale frazione è maggiore?", "img": "c75", "a": ["5/7", "3/7", "sono equivalenti"], "e": "Con lo stesso denominatore è maggiore la frazione con il numeratore maggiore."}, {"t": "t3", "q": "Tra 2/3 e 2/8, quale frazione è maggiore?", "img": "c23", "a": ["2/3", "2/8", "sono equivalenti"], "e": "Con lo stesso numeratore è maggiore la frazione con il denominatore minore: le parti sono più grandi."}, {"t": "t3", "q": "Due frazioni hanno lo stesso numeratore. Quale delle due è maggiore?", "img": "qm", "a": ["quella con il denominatore minore", "quella con il denominatore maggiore", "quella con il numeratore maggiore"], "e": "Se l’intero è diviso in meno parti, ogni parte è più grande."}, {"t": "t4", "q": "Per calcolare la frazione di un numero, prima si…", "img": "qm", "a": ["divide il numero per il denominatore", "moltiplica il numero per il denominatore", "divide il numero per il numeratore"], "e": "Poi si moltiplica il risultato per il numeratore."}, {"t": "t4", "q": "Quanto sono i 2/7 di 21?", "img": "d21", "a": ["6", "3", "14"], "e": "21 : 7 = 3, poi 3 × 2 = 6."}, {"t": "t4", "q": "Quanto sono i 4/9 di 108?", "img": "qm", "a": ["48", "12", "27"], "e": "10 let AC=null, SOUND=true, VOL=1;
try{ SOUND=localStorage.getItem("quizFrazioniSuono")!=="0"; }catch(e){}
function ac(){ if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return null; } } return AC; }
function unlock(){ const c=ac(); if(!c) return; if(c.state!=="running"){ c.resume().catch(()=>{}); }
  try{ const b=c.createBuffer(1,1,22050), src=c.createBufferSource(); src.buffer=b; src.connect(c.destination); src.start(0); }catch(e){} }
["pointerdown","touchstart","keydown","click"].forEach(ev=>document.addEventListener(ev,unlock,{capture:true,passive:true}));
function playNow(fn){ const c=ac(); if(!c) return; if(c.state==="running") fn(c); else c.resume().then(()=>fn(c)).catch(()=>{}); }
function tone(f,t0,dur,type,vol){ playNow(c=>{ const now=c.currentTime+0.02, o=c.createOscillator(), g=c.createGain();
  o.type=type||"sine"; o.frequency.setValueAtTime(f,now+t0);
  g.gain.setValueAtTime(0.0001,now+t0); g.gain.exponentialRampToValueAtTime((vol||0.4)*VOL,now+t0+0.02);
  g.gain.exponentialRampToValueAtTime(0.0001,now+t0+dur); o.connect(g); g.connect(c.destination); o.start(now+t0); o.stop(now+t0+dur+0.05); }); }
function sGood(){ if(!SOUND) return; [523.25,659.25,783.99].forEach((f,i)=>tone(f,i*0.11,0.35,"square",0.22)); tone(1046.5,0.33,0.55,"triangle",0.5); }
function sBad(){ if(!SOUND) return; tone(330,0,0.25,"triangle",0.55); tone(247,0.22,0.45,"triangle",0.55); }
function sEnd(){ if(!SOUND) return; [523.25,659.25,783.99,1046.5,783.99,1046.5].forEach((f,i)=>tone(f,i*0.14,i===5?0.7:0.25,"square",0.22)); }
function toggleSound(){ SOUND=!SOUND; try{ localStorage.setItem("quizFrazioniSuono",SOUND?"1":"0"); }catch(e){} if(SOUND) tone(660,0,0.15,"sine",0.2); render(); }

function hasForm(text,f){ return f.some(x=>new RegExp("(^|[^a-zà-ù])"+x+"([^a-zà-ù]|$)","i").test(text)); }
// parole difficili legate all'immagine (oggetti che i bambini vedono ma non sanno nominare)
const IMG_GLOS={/* chiave immagine: parola del glossario, es. capitello:"capitello" */};
function glossFor(it){
  const right=it.a[0].toLowerCase(), wrong=it.a.slice(1).join(" ");
  const keys=right.split(/[^a-zà-ù]+/i).filter(w=>w.length>=4).map(w=>w.slice(0,5));
  return GLOS.filter(g=>{
    const inQ=hasForm(it.q,g.f), inWrong=hasForm(wrong,g.f), inRight=hasForm(it.a[0],g.f), inImg=IMG_GLOS[it.img]===g.w;
    if(!(inQ||inWrong||inRight||inImg)) return false;
    if(g.w==="unità frazionaria" && /^Ciascuna delle parti/.test(it.q)) return false;
    const dl=g.d.toLowerCase();
    return !keys.some(k=>dl.includes(k));
  });
}

function openVideo(){
  const d=document.createElement("div"); d.className="vwrap"; d.setAttribute("role","dialog"); d.setAttribute("aria-label","Video");
  d.innerHTML=`<div class="vbox"><div class="vhead"><b></b><button class="home" id="vclose">Chiudi ✕</button></div>
    <video controls playsinline preload="metadata" src="${VIDEO_URL}"></video>
    <p class="small">Il video non parte? <a href="${VIDEO_URL}" target="_blank" rel="noopener">Aprilo in una nuova finestra</a>. Serve la connessione a internet.</p></div>`;
  document.body.appendChild(d);
  const close=()=>{ const v=d.querySelector("video"); v&&v.pause(); d.remove(); };
  d.querySelector("#vclose").onclick=close; d.onclick=e=>{ if(e.target===d) close(); };
}
function render(){ setTimeout(()=>{const b=document.getElementById("snd"); if(b) b.onclick=toggleSound;},0);
  if(S.screen==="start"){
    const pool=avail().length;
    app.innerHTML=`
    <div class="bar"><div class="brand">${globe}<span>Matematica · classe 5ª</span></div><div style="margin-left:auto">${sbtn()}</div></div>
    <div class="panel">
      <div class="hero"><div class="ht">
        <h1>Ripasso di <span class="g">frazioni</span> e <span class="e">decimali</span>!</h1>
        <p>Allenati per la verifica. Leggi bene la domanda, poi tocca la risposta giusta tra le tre. Se trovi una parola difficile, toccala per leggere che cosa vuol dire.</p>
      </div><img src="${IMG.cover}" alt=""></div>
      ${VIDEO_URL?`<button class="vbtn" id="vid"><span aria-hidden="true">▶</span> Guarda il video: </button>`:""}

      <div class="step"><h3><i>1</i>Che cosa vuoi ripassare?</h3>
        <div class="tgrid">${Object.entries(TOPICS).map(([k,t])=>{const on=S.topics.includes(k), c=BANK.filter(b=>b.t===k).length;
          return `<button class="tbtn" data-t="${k}" aria-pressed="${on}" style="--c:${t.c};--s:${t.s}"><span class="bx">${on?"✓":""}</span><span class="tn">${t.name}<br><span class="tc">${c} domande${k==="vid"?" · guarda prima il video!":""}</span></span><span class="ic" aria-hidden="true">${t.ic}</span></button>`}).join("")}</div>
        <div class="row"><button class="link" id="all">Scegli tutto</button><button class="link" id="none">Togli tutto</button></div>
        ${S.warn&&!pool?`<p class="warn">Scegli almeno un argomento!</p>`:""}</div>

      <div class="step"><h3><i>2</i>Quante domande?</h3>
        <div class="seg">${[10,15,20,"all"].map(v=>`<button data-c="${v}" aria-pressed="${(S.count===v&&!(v!=="all"&&v>pool&&pool>0))||(v==="all"&&S.count!=="all"&&S.count>pool&&pool>0)}" ${v!=="all"&&v>pool&&pool>0?"disabled":""}>${v==="all"?"Tutte ("+pool+")":v}</button>`).join("")}</div></div>

      <div class="row"><button class="btn" id="go">Comincia! ▶</button>
        <button class="btn rnd" id="rnd"><span aria-hidden="true">🎲</span> Domande a sorpresa</button></div>
      <p class="small" style="margin-top:-10px">“Comincia!” fa le domande un argomento dopo l'altro. “Domande a sorpresa” mescola le domande degli argomenti scelti, saltando da un argomento all'altro.</p>
    </div>`;
    app.querySelectorAll(".tbtn").forEach(b=>b.onclick=()=>{const k=b.dataset.t;
      S.topics=S.topics.includes(k)?S.topics.filter(x=>x!==k):Object.keys(TOPICS).filter(x=>x===k||S.topics.includes(x)); S.warn=false; render();});
    $("#all").onclick=()=>{S.topics=Object.keys(TOPICS); render();};
    $("#none").onclick=()=>{S.topics=[]; render();};
    app.querySelectorAll(".seg button").forEach(b=>b.onclick=()=>{S.count=b.dataset.c==="all"?"all":+b.dataset.c; render();});
    $("#go").onclick=start;
    const vb=$("#vid"); if(vb) vb.onclick=openVideo;
    $("#rnd").onclick=startRandom;
    return;
  }
  if(S.screen==="end"){
    const ok=S.res.filter(Boolean).length, tot=S.order.length, wrong=tot-ok;
    const msg=ok===tot?"Tutte giuste: fantastico!":ok>=tot*0.8?"Ottimo lavoro! Quasi tutte giuste.":ok>=tot/2?"Bene! Ripassa le domande sbagliate.":"Rileggi le pagine del libro, poi riprova: ce la fai!";
    app.innerHTML=`
    <div class="bar"><div class="brand">${globe}<span>Matematica · classe 5ª</span></div><div style="margin-left:auto">${sbtn()}</div></div>
    <div class="panel">
      <h2 class="small" style="font-family:var(--f-body)">Ecco il tuo risultato</h2>
      <div class="row" style="align-items:flex-end;gap:24px"><div class="score">${ok}<span style="color:var(--muted);font-size:.45em"> / ${tot}</span></div>
      <h1 style="font-size:clamp(24px,3vw,40px)">${msg}</h1></div>
      <div class="row">${wrong?`<button class="btn" id="retry">Rifai le ${wrong===1?"domanda sbagliata":wrong+" sbagliate"}</button>`:""}<button class="btn ghost" id="again">Nuovo ripasso</button></div>
      ${wrong?`<h3>Da ripassare</h3><div class="recap">${S.order.map((qi,i)=>S.res[i]?"":`<div class="rc no"><b>${i+1}</b><span>${esc(BANK[qi].q)}<br><span class="small">Risposta giusta: ${esc(BANK[qi].a[0])}</span></span></div>`).join("")}</div>`:""}
      ${ok?`<details><summary class="small" style="cursor:pointer">Domande giuste (${ok})</summary><div class="recap" style="margin-top:10px">${S.order.map((qi,i)=>S.res[i]?`<div class="rc ok"><b>${i+1}</b><span>${esc(BANK[qi].q)}<br><span class="small">${esc(BANK[qi].a[0])}</span></span></div>`:"").join("")}</div></details>`:""}
    </div>`;
    const r=$("#retry"); if(r) r.onclick=retryWrong;
    $("#again").onclick=()=>{S.screen="start";render();window.scrollTo(0,0)}; return;
  }
  const it=BANK[S.order[S.i]], tp=TOPICS[it.t], done=S.pick!==null, ok=done&&S.opts[S.pick].ok;
  app.innerHTML=`
  <div class="bar">
    <button class="home" id="home" aria-label="Torna al menù">⌂ Menù</button>
    ${sbtn()}
    <div class="counter">Domanda ${S.i+1} di ${S.order.length} · <b>✓ ${S.res.filter(Boolean).length}</b></div>
    <div class="track" aria-hidden="true" style="flex-basis:100%">${S.order.map((_,i)=>`<span class="dot ${i===S.i?"now":S.res[i]===true?"ok":S.res[i]===false?"no":""}"></span>`).join("")}</div>
  </div>
  ${S.quit?`<div class="quit" role="alertdialog"><b>Vuoi davvero tornare al menù?</b><span>Le risposte date finora non verranno salvate.</span><div class="row"><button class="btn ghost" id="qno">No, continuo</button><button class="btn qyes" id="qyes">Sì, torna al menù</button></div></div>`:""}
  <div class="stage">
    <div class="track m" aria-hidden="true">${S.order.map((_,i)=>`<span class="dot ${i===S.i?"now":S.res[i]===true?"ok":S.res[i]===false?"no":""}"></span>`).join("")}</div>
    <div class="qcard"><div class="qtxt"><div class="topic"><span style="background:${tp.c}"></span>${tp.name}</div><div class="qtext">${esc(it.q)}</div></div>${it.img?`<img class="qimg" src="${IMG[it.img]}" alt="">`:""}</div>
    ${(()=>{const gl=glossFor(it); return gl.length?`<div class="glos"><span class="glab">Parole difficili:</span>${gl.map((g,k)=>`<button class="gchip" data-g="${k}">${esc(g.w)}</button>`).join("")}<div class="gdef" id="gdef" hidden></div></div>`:""})()}
    <div class="answers">${S.opts.map((o,k)=>{
      let c=""; if(done){ if(o.ok) c="right"; else if(k===S.pick) c="bad"; else c="dim"; }
      return `<button class="ans ${c}" data-k="${k}" ${done?"disabled":""}><span class="k">${"ABC"[k]}</span><span>${esc(o.x)}</span></button>`}).join("")}</div>
    ${done?`<div class="fb ${ok?"ok":"no"}" role="status">${it.after?`<img class="fimg" src="${IMG[it.after]}" alt="">`:""}<div class="msg"><strong>${ok?"Giusto!":"Non è questa…"}</strong>${ok?"":"La risposta giusta è: <b>"+esc(it.a[0])+"</b>. "}${esc(it.e)}</div>
      <button class="btn" id="next">${S.i>=S.order.length-1?"Vedi il risultato":"Domanda successiva"}</button></div>`:""}
  </div>`;
  app.querySelectorAll(".ans").forEach(b=>b.onclick=()=>answer(+b.dataset.k));
  const GL=glossFor(it); app.querySelectorAll(".gchip").forEach(b=>b.onclick=()=>{const g=GL[+b.dataset.g], box=$("#gdef");
    const open=b.classList.contains("on"); app.querySelectorAll(".gchip").forEach(x=>x.classList.remove("on"));
    if(open){box.hidden=true;return;} b.classList.add("on"); box.innerHTML=`<b>${esc(g.w)}</b>: ${esc(g.d)}`; box.hidden=false;});
  $("#home").onclick=()=>{ S.quit=true; render(); window.scrollTo(0,0); };
  if(S.quit){ $("#qno").onclick=()=>{S.quit=false;render();}; $("#qyes").onclick=()=>{S.quit=false;S.screen="start";render();window.scrollTo(0,0);}; }
  const nb=$("#next"); if(nb){ nb.onclick=next; if(window.innerWidth<=700) setTimeout(()=>nb.scrollIntoView({behavior:"smooth",block:"nearest"}),80); }
}
document.addEventListener("keydown",e=>{
  if(S.screen!=="q") return;
  if(S.pick===null && ["1","2","3","a","b","c"].includes(e.key.toLowerCase())){answer("123".indexOf(e.key)>-1?"123".indexOf(e.key):"abc".indexOf(e.key.toLowerCase()))}
  else if(S.pick!==null && (e.key==="Enter"||e.key===" "||e.key==="ArrowRight")){e.preventDefault();next()}
});
function boot(d){ if(d&&d.S) S=d.S; render(); }
window.claude?.hot?.snapshot?.(()=>({S}));
window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});
</script>
</html>
